"193.292" fill="#1B2A44" font-size="14" textLength="52.678" font-family="Sans">Wave 2</text><text x="425.83" y="209.589" fill="#1B2A44" font-size="14" textLength="159.045" font-family="Sans">слой событий заказа,</text><text x="425.83" y="225.886" fill="#1B2A44" font-size="14" textLength="96.995" font-family="Sans">outbox и CDC</text></g><!--entity W3--><g class="entity" data-qualified-name="W3" id="ent0004" data-source-line="22"><rect x="672.08" y="44.297" width="182.784" height="68.891" fill="#D5E8D4" style="stroke:#33507A;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="682.08" y="67.292" fill="#1B2A44" font-size="14" textLength="52.678" font-family="Sans">Wave 3</text><text x="682.08" y="83.589" fill="#1B2A44" font-size="14" textLength="120.08" font-family="Sans">сервис статусов</text><text x="682.08" y="99.886" fill="#1B2A44" font-size="14" textLength="162.784" font-family="Sans">read-модель и cutover</text></g><!--entity W4--><g class="entity" data-qualified-name="W4" id="ent0005" data-source-line="23"><rect x="660.57" y="148.297" width="205.814" height="68.891" fill="#D5E8D4" style="stroke:#33507A;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="670.57" y="171.292" fill="#1B2A44" font-size="14" textLength="52.678" font-family="Sans">Wave 4</text><text x="670.57" y="187.589" fill="#1B2A44" font-size="14" textLength="168.704" font-family="Sans">интеграционный слой,</text><text x="670.57" y="203.886" fill="#1B2A44" font-size="14" textLength="185.814" font-family="Sans">уход от обмена через БД</text></g><!--entity W5--><g class="entity" data-qualified-name="W5" id="ent0006" data-source-line="24"><rect x="691.51" y="252.297" width="143.922" height="68.891" fill="#D5E8D4" style="stroke:#33507A;stroke-width:0.5;" rx="2.5" ry="2.5"/><text x="701.51" y="275.292" fill="#1B2A44" font-size="14" textLength="52.678" font-family="Sans">Wave 5</text><text x="701.51" y="291.589" fill="#1B2A44" font-size="14" textLength="123.922" font-family="Sans">разгрузка Oracle</text><text x="7