name: Рендер диаграмм PlantUML

# Генерирует PNG и SVG из всех *.puml при изменении диаграмм
# и коммитит результат обратно в ветку.
on:
  push:
    paths:
      - '**/*.puml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка PlantUML и Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y plantuml graphviz

      - name: Рендер PNG и SVG
        run: |
          find . -name '*.puml' -not -path './.git/*' -print0 | xargs -0 -r plantuml -tpng
          find . -name '*.puml' -not -path './.git/*' -print0 | xargs -0 -r plantuml -tsvg

      - name: Коммит сгенерированных диаграмм
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          find . \( -name '*.png' -o -name '*.svg' \) -path '*/diagrams/*' -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            echo "Изменений в диаграммах нет."
          else
            git commit -m "chore: рендер PlantUML-диаграмм [skip ci]"
            git push
          fi
